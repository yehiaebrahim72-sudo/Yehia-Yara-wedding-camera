<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7eef2">
  <title>Yehia & Yara | Wedding Photos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page center">
    <section class="card welcome">
      <div class="rings">yehia&yara</div>
      <h1>Share Our Wedding Moments 🤍</h1>
      <p>Enter your name, then use the camera to take up to 10 photos and record a video up to 20 seconds.</p>
      <form id="nameForm">
        <label for="guestName">Your Name</label>
        <input id="guestName" name="guestName" maxlength="100" autocomplete="name" required placeholder="Enter your name">
        <button class="primary" type="submit">Start Taking Photos 📸</button>
      </form>
    </section>
  </main>
  <script>
    document.getElementById('nameForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('guestName').value.trim();
      if (!name) return;
      sessionStorage.setItem('guest_name', name);
      sessionStorage.setItem('guest_id', crypto.randomUUID());
      location.href = 'camera.html';
    });
  </script>
</body>
</html>
